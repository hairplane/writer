<!-- v1.3: 분류 태그 스타일 개선(순백 배경/선명한 테두리), 필터 변경 시 글의 구성 창 자동 초기화 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 목록 & 글의 구성 테스트 - v1.3</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.45;
            word-break: keep-all;
            padding: 10px 12px 30px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .test-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
        }

        .test-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .version-badge {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 700;
            background: #eff6ff;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #bfdbfe;
        }

        /* 정사각형 토글 미니 버튼 */
        .btn-section-toggle {
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: #334155;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: monospace;
            cursor: pointer;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            transition: all 0.15s ease;
        }
        .btn-section-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-section-toggle.is-closed {
            background: #fef3c7;
            border-color: #fde68a;
            color: #b45309;
        }

        .badge-collapsed {
            display: none;
            font-size: 0.68rem;
            font-weight: 700;
            color: #b45309;
            background: #fef3c7;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #fde68a;
            margin-left: 4px;
        }
        .badge-collapsed.show {
            display: inline-block;
        }

        .header-collapsed-line {
            border-bottom: 1px dashed #cbd5e1 !important;
        }

        .btn-copy {
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: #475569;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            transition: all 0.15s ease;
        }
        .btn-copy:hover {
            background: #f1f5f9;
            color: var(--primary);
            border-color: var(--border-color);
        }

        /* === [MODULE-STYLE: post-list] === */
        .post-list-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .post-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 3px;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 6px;
        }

        .post-list-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-list-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .category-filter-wrap {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .status-filter-wrap {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .select-filter {
            padding: 2px 4px;
            font-size: 0.76rem;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            outline: none;
            background: #fff;
            color: #334155;
            font-weight: 600;
        }

        .post-list-rows {
            display: flex;
            flex-direction: column;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: #ffffff;
            padding-bottom: 2px;
        }

        .post-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            min-height: 26px;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.1s ease;
        }
        .post-row-item:last-child { border-bottom: none; }
        .post-row-item:nth-child(even) { background-color: #eef2f6; }
        .post-row-item:hover { background-color: #e2e8f0 !important; }
        .post-row-item.active { background-color: #dbeafe !important; }

        .post-row-title-area {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.82rem;
            color: #334155;
            flex: 1;
            overflow: hidden;
        }

        .bullet-point { color: #94a3b8; font-size: 0.75rem; user-select: none; }
        .post-row-item.active .bullet-point { color: var(--primary); font-weight: 900; }

        /* 선명하고 정돈된 순백 배경의 분류 태그 */
        .post-category-tag {
            display: inline-block;
            width: 62px;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 600;
            color: #334155;
            background: #ffffff;
            padding: 1px 0;
            border-radius: 3px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-row-title {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .post-row-title:hover { text-decoration: underline; }
        .post-row-item.active .post-row-title { color: var(--primary); font-weight: 700; }

        /* 상황 토글 버튼 스타일 */
        .btn-status-toggle {
            flex-shrink: 0;
            padding: 1px 5px;
            font-size: 0.68rem;
            font-weight: 600;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.1s ease;
            margin-left: 6px;
        }
        .btn-status-toggle.status-writing {
            background: #e0f2fe;
            color: #0369a1;
            border-color: #bae6fd;
        }
        .btn-status-toggle.status-writing:hover { background: #bae6fd; }

        .btn-status-toggle.status-done {
            background: #dcfce7;
            color: #15803d;
            border-color: #bbf7d0;
        }
        .btn-status-toggle.status-done:hover { background: #bbf7d0; }

        .btn-status-toggle.status-plan {
            background: #fef3c7;
            color: #b45309;
            border-color: #fde68a;
        }
        .btn-status-toggle.status-plan:hover { background: #fde68a; }
        /* === [MODULE-STYLE-END: post-list] === */

        /* === [MODULE-STYLE: outline] === */
        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .section-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--border-light);
        }

        .section-header-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: #334155;
        }

        .editor-content-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        textarea.flat-textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.88rem;
            line-height: 1.5;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #ffffff;
            outline: none;
            resize: none;
            overflow-y: hidden;
            font-family: inherit;
        }
        textarea.flat-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        #essayOutline { font-size: 0.85rem; letter-spacing: -0.01em; }

        .outline-bottom-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            padding: 1px 2px;
        }

        .btn-restore-icon {
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: #475569;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .btn-restore-icon:hover { background-color: #f1f5f9; color: #0f172a; }
        /* === [MODULE-STYLE-END: outline] === */

        .test-log {
            background: #0f172a;
            color: #38bdf8;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="test-header">
        <h1>글 목록 & 글의 구성 테스트 <span class="version-badge">v1.3</span></h1>
        <span style="font-size: 0.75rem; color: #64748b;">초경량 독립 검증</span>
    </div>

    <!-- === [MODULE-HTML: post-list] === -->
    <div id="sec_postList" class="post-list-box">
        <div id="hdr_postList" class="post-list-header">
            <div class="post-list-title-wrap">
                <div class="post-list-title">
                    <button type="button" id="arrow_postList" class="btn-section-toggle" onclick="toggleSection('postList')" title="열림/숨김">−</button>
                    <span>작성 글 목록</span>
                    <span id="badge_postList" class="badge-collapsed">숨김</span>
                </div>
                <div class="category-filter-wrap">
                    <label for="categoryFilter" style="font-size: 0.74rem; font-weight: 600; color: #475569;">분류:</label>
                    <select id="categoryFilter" class="select-filter" onchange="handleFilterChange()">
                        <option value="전체" selected>전체</option>
                    </select>
                </div>
            </div>

            <div class="status-filter-wrap">
                <label for="statusFilter" style="font-size: 0.74rem; font-weight: 600; color: #475569;">상황:</label>
                <select id="statusFilter" class="select-filter" onchange="handleFilterChange()">
                    <option value="전체" selected>전체</option>
                    <option value="작성">작성</option>
                    <option value="완료">완료</option>
                    <option value="예정">예정</option>
                </select>
            </div>
        </div>
        <div id="body_postList" class="post-list-rows">
            <span style="font-size: 0.78rem; color: #64748b; padding: 4px 6px;">목록을 불러오는 중입니다...</span>
        </div>
    </div>
    <!-- === [MODULE-HTML-END: post-list] === -->

    <!-- === [MODULE-HTML: outline] === -->
    <div id="sec_outline" class="editor-section">
        <div id="hdr_outline" class="section-header-line">
            <div class="section-header-left">
                <button type="button" id="arrow_outline" class="btn-section-toggle" onclick="toggleSection('outline')" title="열림/숨김">−</button>
                <span class="section-title">글의 구성</span>
                <span id="badge_outline" class="badge-collapsed">숨김</span>
            </div>
            <button type="button" id="copyBtn_outline" class="btn-copy" onclick="copyContent('essayOutline', this)">📋 복사</button>
        </div>
        <div id="body_outline" class="editor-content-wrap">
            <textarea id="essayOutline" class="flat-textarea" rows="3" placeholder="글의 구성을 입력하세요 (● 기호 자동 줄바꿈 지원)" onkeydown="handleBulletEnter(event, this)" oninput="handleOutlineInput()"></textarea>
            <div class="outline-bottom-toolbar">
                <button type="button" class="btn-restore-icon" onclick="undoOutline()">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSavedOutline()">⟲ 최근 저장 상태로</button>
            </div>
        </div>
    </div>
    <!-- === [MODULE-HTML-END: outline] === -->

    <div id="testLog" class="test-log">상태: 준비 완료</div>
</div>

<script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzFdIdTROi1QhNrIj6bpoiT6vLdkhD2jWoCiDyUSg5Zyj8uGGHVZqjUlbbqz-tmH37rjg/exec";
    const POSTS_CACHE_KEY = "WRITER_POSTS_CACHE_V03";
    const $ = id => document.getElementById(id);

    function log(msg) {
        const el = $('testLog');
        el.innerText = `[${new Date().toLocaleTimeString()}] ${msg}\n` + el.innerText;
    }

    // 정사각형 토글 로직
    function toggleSection(key) {
        const bodyEl = $(`body_${key}`);
        const arrow = $(`arrow_${key}`);
        const badge = $(`badge_${key}`);
        const hdr = $(`hdr_${key}`);
        const copyBtn = $(`copyBtn_${key}`);
        if (!bodyEl) return;

        const isClosed = bodyEl.style.display === 'none';
        if (isClosed) {
            bodyEl.style.display = 'flex';
            if (arrow) {
                arrow.innerText = '−';
                arrow.classList.remove('is-closed');
            }
            if (badge) badge.classList.remove('show');
            if (hdr) hdr.classList.remove('header-collapsed-line');
            if (copyBtn) copyBtn.style.display = 'inline-flex';
        } else {
            bodyEl.style.display = 'none';
            if (arrow) {
                arrow.innerText = '+';
                arrow.classList.add('is-closed');
            }
            if (badge) badge.classList.add('show');
            if (hdr) hdr.classList.add('header-collapsed-line');
            if (copyBtn) copyBtn.style.display = 'none';
        }
    }

    // 클립보드 복사
    function copyContent(elementId, btn) {
        const el = $(elementId);
        if (!el || !el.value.trim()) {
            return alert('복사할 내용이 없습니다.');
        }
        navigator.clipboard.writeText(el.value).then(() => {
            const originalText = btn.innerText;
            btn.innerText = '✓ 복사됨';
            btn.style.color = '#16a34a';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.color = '';
            }, 1500);
        });
    }

    // 텍스트 영역 자동 높이 조절
    function autoResizeTextarea(textarea) {
        if (!textarea) return;
        textarea.style.height = 'auto';
        textarea.style.height = `${Math.max(textarea.scrollHeight, 72)}px`;
    }

    // 글의 구성 창 내용 완전 초기화
    function resetOutlineArea() {
        const textarea = $('essayOutline');
        textarea.value = '';
        outlineSaved = '';
        outlineHistory = [''];
        autoResizeTextarea(textarea);
    }

    // 분류 / 상황 드롭다운 선택 시: 목록 재렌더링 및 글의 구성 창 초기화
    function handleFilterChange() {
        currentPostId = null;
        resetOutlineArea();
        renderPostList();
        log('필터 변경: 글의 구성 초기화됨');
    }

    // === [MODULE-SCRIPT: post-list] ===
    let currentPostId = null;
    let currentPostStatus = "작성";
    let postListCache = [];

    window.addEventListener('DOMContentLoaded', () => {
        loadCachedPosts();
        fetchSheetPosts();
    });

    function loadCachedPosts() {
        const cached = localStorage.getItem(POSTS_CACHE_KEY);
        if (cached) {
            try {
                postListCache = JSON.parse(cached);
                populateCategoryFilter();
                renderPostList();
                log(`캐시 목록 ${postListCache.length}개 로드`);
            } catch (e) {
                console.error(e);
            }
        }
    }

    function fetchSheetPosts() {
        const oldScript = document.getElementById('gas_jsonp_script');
        if (oldScript) oldScript.remove();

        window.handleGasResponse = function(response) {
            if (response && response.status === "success" && response.data) {
                postListCache = response.data;
                localStorage.setItem(POSTS_CACHE_KEY, JSON.stringify(postListCache));
                populateCategoryFilter();
                renderPostList();
                log(`시트 동기화 완료: ${postListCache.length}개`);
            }
        };

        const script = document.createElement('script');
        script.id = 'gas_jsonp_script';
        script.src = `${GAS_ENDPOINT}?callback=handleGasResponse&_t=${new Date().getTime()}`;
        document.body.appendChild(script);
    }

    // '분류' 고유값 추출하여 드롭다운 구성
    function populateCategoryFilter() {
        const select = $('categoryFilter');
        const currentVal = select.value;
        const categories = new Set();

        postListCache.forEach(item => {
            const cat = (item.분류 || item.category || '').trim();
            if (cat) categories.add(cat);
        });

        select.innerHTML = '<option value="전체">전체</option>';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);
        });

        if (Array.from(categories).includes(currentVal)) {
            select.value = currentVal;
        } else {
            select.value = '전체';
        }
    }

    function renderPostList() {
        const grid = $('body_postList');
        const statusFilter = $('statusFilter').value;
        const categoryFilter = $('categoryFilter').value;
        grid.innerHTML = '';

        const filtered = postListCache.filter(item => {
            const itemStatus = (item.상황 || item.status || '작성').trim();
            const itemCategory = (item.분류 || item.category || '').trim();

            const matchStatus = (statusFilter === '전체') || (itemStatus === statusFilter);
            const matchCategory = (categoryFilter === '전체') || (itemCategory === categoryFilter);

            return matchStatus && matchCategory;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<span style="font-size:0.78rem; color:#64748b; padding:4px 6px;">해당 조건의 글이 없습니다.</span>';
            return;
        }

        filtered.forEach(post => {
            const postId = post.ID || post.id || '';
            const postTitle = post.제목 || post.title || '(제목 없음)';
            const postStatus = (post.상황 || post.status || '작성').trim();
            const postCategory = (post.분류 || post.category || '').trim();

            const row = document.createElement('div');
            row.className = `post-row-item ${currentPostId === postId ? 'active' : ''}`;

            const titleArea = document.createElement('div');
            titleArea.className = 'post-row-title-area';

            let categoryTagHtml = `<span class="post-category-tag" title="${postCategory || '미분류'}">${postCategory || '-'}</span>`;
            titleArea.innerHTML = `<span class="bullet-point">•</span>${categoryTagHtml}<span class="post-row-title" title="${postTitle}">${postTitle}</span>`;
            titleArea.onclick = () => selectPost(post);

            let statusClass = 'status-writing';
            if (postStatus === '완료') statusClass = 'status-done';
            else if (postStatus === '예정') statusClass = 'status-plan';

            const statusBtn = document.createElement('button');
            statusBtn.type = 'button';
            statusBtn.className = `btn-status-toggle ${statusClass}`;
            statusBtn.innerText = postStatus;
            statusBtn.title = "클릭 시 상황 변경 (작성 -> 완료 -> 예정)";
            statusBtn.onclick = (e) => {
                e.stopPropagation();
                togglePostStatus(post);
            };

            row.appendChild(titleArea);
            row.appendChild(statusBtn);
            grid.appendChild(row);
        });
    }

    function togglePostStatus(post) {
        const current = (post.상황 || post.status || '작성').trim();
        let nextStatus = '작성';
        if (current === '작성') nextStatus = '완료';
        else if (current === '완료') nextStatus = '예정';
        else if (current === '예정') nextStatus = '작성';

        post.상황 = nextStatus;
        post.status = nextStatus;

        if (currentPostId === (post.ID || post.id)) {
            currentPostStatus = nextStatus;
        }

        localStorage.setItem(POSTS_CACHE_KEY, JSON.stringify(postListCache));
        renderPostList();
        log(`상태 토글: "${post.제목 || post.title}" (${current} -> ${nextStatus})`);

        fetch(GAS_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                ID: post.ID || post.id,
                id: post.ID || post.id,
                status: nextStatus,
                category: post.분류 || post.category || '',
                title: post.제목 || post.title || '',
                outline: post.글의구성 || post['글의 구성'] || post.outline || ''
            })
        });
    }

    function selectPost(post) {
        currentPostId = post.ID || post.id || '';
        currentPostStatus = (post.상황 || post.status || '작성').trim();

        const outlineText = post.글의구성 || post['글의 구성'] || post['글의\n구성'] || post.outline || '';

        const textarea = $('essayOutline');
        textarea.value = outlineText;
        outlineSaved = outlineText;
        outlineHistory = [outlineText];
        autoResizeTextarea(textarea);

        renderPostList();
        log(`선택됨: "${post.제목 || post.title}" (ID: ${currentPostId}) | 구성 연동 (${outlineText.length}자)`);
    }
    // === [MODULE-SCRIPT-END: post-list] ===

    // === [MODULE-SCRIPT: outline] ===
    let outlineSaved = '';
    let outlineHistory = [''];

    function handleOutlineInput() {
        const textarea = $('essayOutline');
        const val = textarea.value;
        if (outlineHistory[outlineHistory.length - 1] !== val) {
            outlineHistory.push(val);
            if (outlineHistory.length > 50) outlineHistory.shift();
        }
        autoResizeTextarea(textarea);
    }

    function undoOutline() {
        if (outlineHistory.length > 1) {
            outlineHistory.pop();
            const textarea = $('essayOutline');
            textarea.value = outlineHistory[outlineHistory.length - 1];
            autoResizeTextarea(textarea);
        } else {
            alert('되돌릴 이전 입력 내용이 없습니다.');
        }
    }

    function restoreSavedOutline() {
        const textarea = $('essayOutline');
        if (textarea.value === outlineSaved) {
            return alert('이미 최근 저장된 상태와 동일합니다.');
        }
        outlineHistory.push(outlineSaved);
        textarea.value = outlineSaved;
        autoResizeTextarea(textarea);
    }

    function handleBulletEnter(e, textarea) {
        if (e.key === 'Enter') {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const value = textarea.value;
            const lineStart = value.lastIndexOf('\n', start - 1) + 1;
            const currentLine = value.substring(lineStart, start);

            if (currentLine.trim().startsWith('●')) {
                e.preventDefault();
                if (currentLine.trim() === '●') {
                    const before = value.substring(0, lineStart);
                    const after = value.substring(end);
                    textarea.value = before + after;
                    textarea.selectionStart = textarea.selectionEnd = lineStart;
                    autoResizeTextarea(textarea);
                    return;
                }
                const bullet = '\n● ';
                textarea.value = value.substring(0, start) + bullet + value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + bullet.length;
                handleOutlineInput();
            }
        }
    }
    // === [MODULE-SCRIPT-END: outline] ===
</script>
