<!-- v1.1: 글 선택 시 전체 집필창 시트데이터 자동연동, 소제목 클릭 시 단독집중모드(Focus View) 토글, PC 토글버튼 마이너스 기호 중앙정렬 보정 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 스튜디오</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.45;
            word-break: keep-all;
            padding: 10px 12px 30px;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 1. 스퀘어 모서리 2단 헤더 */
        header.mac-window-header {
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            border: 1px solid #cbd5e1;
            border-bottom: 2px solid #94a3b8;
            user-select: none;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title-wrap h1 {
            font-size: 0.98rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title-wrap .version-tag {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 700;
            background: #ffffff;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #bfdbfe;
        }

        .btn-close-app {
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1;
            padding: 2px 4px;
            cursor: pointer;
        }
        .btn-close-app:hover { color: #dc2626; }

        .header-toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 10px;
            background: #fafafa;
            flex-wrap: wrap;
        }

        .toggle-guide-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: #64748b;
            margin-right: 2px;
        }

        .traffic-group {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .traffic-btn {
            position: relative;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 0.5px solid rgba(0, 0, 0, 0.15);
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .traffic-btn:hover { transform: scale(1.15); opacity: 0.9; }

        .tb-postList { background-color: #0284c7; }
        .tb-meta { background-color: #0d9488; }
        .tb-outline { background-color: #10b981; }
        .tb-completed { background-color: #3b82f6; }
        .tb-newDraft { background-color: #8b5cf6; }
        .tb-intent { background-color: #6366f1; }
        .tb-api { background-color: #f59e0b; }
        .tb-promptReq { background-color: #ec4899; }
        .tb-aiRefined { background-color: #06b6d4; }
        .tb-snippets { background-color: #64748b; }

        .traffic-btn.is-closed {
            filter: grayscale(0.5) brightness(0.85);
            opacity: 0.7;
        }
        .traffic-btn.is-closed::after {
            content: '/';
            position: absolute;
            font-size: 11px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        /* 2. 공통 헤더 정사각형 [−]/[+] 토글 버튼 (PC 중앙정렬 완벽 보정) */
        .btn-section-toggle {
            width: 18px;
            height: 18px;
            min-width: 18px;
            min-height: 18px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: #334155;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: system-ui, -apple-system, sans-serif;
            cursor: pointer;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
            padding: 0;
            margin: 0;
            text-indent: 0;
            transition: all 0.15s ease;
        }
        .btn-section-toggle:hover { border-color: var(--primary); color: var(--primary); }
        .btn-section-toggle.is-closed { background: #fef3c7; border-color: #fde68a; color: #b45309; }

        .badge-collapsed {
            display: none;
            font-size: 0.68rem;
            font-weight: 700;
            color: #b45309;
            background: #fef3c7;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #fde68a;
            margin-left: 4px;
        }
        .badge-collapsed.show { display: inline-block; }
        .header-collapsed-line { border-bottom: 1px dashed #cbd5e1 !important; }

        /* 액션 툴바 */
        .action-toolbar-clean {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            padding: 0 2px;
        }

        .btn {
            padding: 5px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-default { background: #ffffff; border-color: var(--border-color); color: var(--text-main); }
        .btn-default:hover { background-color: #f1f5f9; }
        .btn-primary { background: var(--primary); color: #ffffff; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background: #ffffff; border-color: #fca5a5; color: #dc2626; }
        .btn-danger:hover { background-color: #fef2f2; }

        .btn-copy {
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: #475569;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            transition: all 0.15s ease;
        }
        .btn-copy:hover { background: #f1f5f9; color: var(--primary); border-color: var(--border-color); }

        /* 작성 글 목록 모듈 */
        .post-list-box { display: flex; flex-direction: column; gap: 4px; }
        .post-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 3px;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 6px;
        }

        .post-list-title-wrap { display: flex; align-items: center; gap: 8px; }
        .post-list-title { font-size: 0.86rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; }

        .select-filter {
            padding: 2px 4px;
            font-size: 0.76rem;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            outline: none;
            background: #fff;
            color: #334155;
            font-weight: 600;
        }

        .post-list-rows {
            display: flex;
            flex-direction: column;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: #ffffff;
            padding-bottom: 2px;
        }

        .post-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 8px;
            min-height: 26px;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.1s ease;
        }
        .post-row-item:last-child { border-bottom: none; }
        .post-row-item:nth-child(even) { background-color: #eef2f6; }
        .post-row-item:hover { background-color: #e2e8f0 !important; }
        .post-row-item.active { background-color: #dbeafe !important; }

        .post-row-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.82rem;
            color: #334155;
            flex: 1;
            overflow: hidden;
        }

        /* 슬림 텍스트 열 형태의 분류 */
        .post-category-tag {
            display: inline-block;
            width: 62px;
            text-align: left;
            font-size: 0.74rem;
            font-weight: 600;
            color: #64748b;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
        }
        .post-row-item.active .post-category-tag { color: var(--primary); font-weight: 700; }

        .post-row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
        .post-row-title:hover { text-decoration: underline; }
        .post-row-item.active .post-row-title { color: var(--primary); font-weight: 700; }

        /* 상황 3종 순환 버튼 스타일 */
        .btn-status-toggle {
            flex-shrink: 0;
            padding: 1px 5px;
            font-size: 0.68rem;
            font-weight: 600;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.1s ease;
            margin-left: 6px;
        }
        .btn-status-toggle.status-writing { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
        .btn-status-toggle.status-writing:hover { background: #bae6fd; }
        .btn-status-toggle.status-done { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
        .btn-status-toggle.status-done:hover { background: #bbf7d0; }
        .btn-status-toggle.status-plan { background: #fef3c7; color: #b45309; border-color: #fde68a; }
        .btn-status-toggle.status-plan:hover { background: #fde68a; }

        /* 메타정보 표 모듈 */
        .meta-table-box { display: flex; flex-direction: column; gap: 4px; }
        .meta-table-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 3px; border-bottom: 1px solid var(--border-light); }
        .meta-table-title { font-size: 0.86rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; }

        .meta-grid-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: #ffffff; border: 1px solid var(--border-color); border-radius: 3px; }
        .meta-grid-table th { width: 80px; background: #f8fafc; color: #475569; font-weight: 600; padding: 4px 6px; text-align: center; border: 1px solid var(--border-light); white-space: nowrap; }
        .meta-grid-table td { padding: 3px 6px; border: 1px solid var(--border-light); background: #ffffff; }
        .meta-grid-table input, .meta-grid-table textarea { width: 100%; border: none; outline: none; font-size: 0.82rem; font-family: inherit; background: transparent; color: #0f172a; }
        .meta-grid-table input:focus, .meta-grid-table textarea:focus { background: #f0f7ff; }

        /* API 키 관리 박스 */
        .api-box { display: flex; flex-direction: column; gap: 4px; }
        .api-box-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 3px; border-bottom: 1px solid var(--border-light); }
        .api-header-left { display: flex; align-items: center; gap: 5px; }
        .api-section-title { font-size: 0.86rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; }
        .api-status-badge { font-size: 0.74rem; font-weight: 700; color: #d97706; background: #fef3c7; padding: 2px 6px; border-radius: 3px; border: 1px solid #fde68a; }
        .btn-key-compact { background: #ffffff; color: #d97706; border: 1px solid #fde68a; border-radius: 3px; padding: 1px 5px; font-size: 0.78rem; text-decoration: none; }
        .api-content-wrap { background: #fffdf5; border: 1px solid #fde68a; padding: 6px 8px; border-radius: 4px; }
        .api-row { display: flex; align-items: center; gap: 4px; position: relative; flex-wrap: wrap; }
        .api-row input { flex: 1; min-width: 160px; padding: 5px 8px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 3px; outline: none; background: #fff; }
        .api-btn-group { display: flex; gap: 4px; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .api-save-btn { background: #f57c00; color: white; border: none; padding: 5px 10px; border-radius: 3px; font-size: 0.76rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 3px; }
        .api-save-btn:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
        .api-wait-btn { background: #e67e22 !important; }
        .api-cancel-btn { background: #64748b; color: white; border: none; padding: 5px 8px; border-radius: 3px; font-size: 0.76rem; font-weight: 700; cursor: pointer; display: none; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 110%; background-color: #ffffff; min-width: 140px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; border-radius: 3px; z-index: 50; }
        .dropdown-content button { color: #334155; padding: 6px 10px; text-align: left; background: none; border: none; width: 100%; cursor: pointer; font-size: 0.76rem; font-weight: 600; display: block; }
        .dropdown-content.show { display: block; }
        .api-del-btn { background: #ef4444; color: white; border: none; padding: 5px 8px; border-radius: 3px; font-size: 0.76rem; font-weight: 700; cursor: pointer; display: none; }

        /* 동적 집필 영역 공통 스타일 */
        .editor-section { display: flex; flex-direction: column; gap: 3px; }
        .section-header-line { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2px; border-bottom: 1px solid var(--border-light); }
        .section-header-left { display: flex; align-items: center; gap: 5px; }

        /* 소제목 단독 집중 모드(Focus View) 클릭 가능 스타일 */
        .section-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 3px;
            user-select: none;
            transition: all 0.15s ease;
        }
        .section-title:hover {
            color: var(--primary);
            background: #eff6ff;
            text-decoration: underline;
        }
        .section-title.is-focused {
            color: var(--primary);
            background: #dbeafe;
        }

        .editor-content-wrap { display: flex; flex-direction: column; gap: 4px; }

        textarea.flat-textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.88rem;
            line-height: 1.5;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #ffffff;
            outline: none;
            resize: none;
            overflow-y: hidden;
            font-family: inherit;
        }
        textarea.flat-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

        .editor-bottom-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-sub);
            padding: 1px 2px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .stat-info { font-weight: 500; }
        .restore-group { display: flex; gap: 3px; margin-left: auto; }
        .btn-restore-icon {
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: #475569;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 3px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .btn-restore-icon:hover { background-color: #f1f5f9; color: #0f172a; }

        .btn-ai-req { background: #4f46e5; color: #ffffff; border: none; padding: 2px 7px; border-radius: 3px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
        .btn-ai-req:hover { background: #4338ca; }
        .btn-append-header { background: #0284c7; color: #ffffff; border: none; padding: 2px 7px; border-radius: 3px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
        .btn-append-header:hover { background: #0369a1; }

        @media (max-width: 640px) {
            body { padding: 6px 8px 24px; }
            .container { gap: 8px; }
            .meta-grid-table th { width: 70px; font-size: 0.75rem; }
            .meta-grid-table td { font-size: 0.78rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 스퀘어 모서리 2단 헤더 -->
    <header class="mac-window-header">
        <div class="header-top-row">
            <div class="header-title-wrap">
                <h1>✍️ 글쓰기 스튜디오</h1>
                <span class="version-tag">v1.1</span>
            </div>
            <button type="button" class="btn-close-app" onclick="cancelAndClose()" title="창 닫기">✕</button>
        </div>

        <div class="header-toggle-row">
            <span class="toggle-guide-label">열고 닫기:</span>
            <div class="traffic-group">
                <span id="dot_postList" class="traffic-btn tb-postList" onclick="toggleSection('postList')" title="작성 글 목록"></span>
                <span id="dot_meta" class="traffic-btn tb-meta" onclick="toggleSection('meta')" title="작성 글 정보"></span>
                <span id="dot_outline" class="traffic-btn tb-outline" onclick="toggleSection('outline')" title="글의 구성"></span>
                <span id="dot_completed" class="traffic-btn tb-completed" onclick="toggleSection('completed')" title="완성 글"></span>
                <span id="dot_newDraft" class="traffic-btn tb-newDraft" onclick="toggleSection('newDraft')" title="신규 글"></span>
                <span id="dot_intent" class="traffic-btn tb-intent" onclick="toggleSection('intent')" title="글의 의도"></span>
                <span id="dot_api" class="traffic-btn tb-api" onclick="toggleSection('api')" title="API 설정"></span>
                <span id="dot_promptReq" class="traffic-btn tb-promptReq" onclick="toggleSection('promptReq')" title="요청 내용 (to AI)"></span>
                <span id="dot_aiRefined" class="traffic-btn tb-aiRefined" onclick="toggleSection('aiRefined')" title="AI 수정 글"></span>
                <span id="dot_snippets" class="traffic-btn tb-snippets" onclick="toggleSection('snippets')" title="보관 글"></span>
            </div>
        </div>
    </header>

    <!-- 2. 액션 툴바 -->
    <div id="mainActionToolbar" class="action-toolbar-clean">
        <button type="button" class="btn btn-default" onclick="saveWork('stay')">저장/계속</button>
        <button type="button" class="btn btn-primary" onclick="saveWork('exit')">저장/종료</button>
        <button type="button" class="btn btn-danger" onclick="cancelWork()">취소</button>
    </div>

    <!-- 3. 작성 글 목록 (슬림 텍스트 열 + 3단 상황 순환) -->
    <div id="sec_postList" class="post-list-box">
        <div id="hdr_postList" class="post-list-header">
            <div class="post-list-title-wrap">
                <div class="post-list-title">
                    <button type="button" id="arrow_postList" class="btn-section-toggle" onclick="toggleSection('postList')" title="열림/숨김">−</button>
                    <span class="section-title" onclick="toggleFocusView('postList')" title="클릭 시 단독 집중 모드">작성 글 목록</span>
                    <span id="badge_postList" class="badge-collapsed">숨김</span>
                </div>
                <div>
                    <label for="categoryFilter" style="font-size: 0.74rem; font-weight: 600; color: #475569;">분류:</label>
                    <select id="categoryFilter" class="select-filter" onchange="handleFilterChange()">
                        <option value="전체" selected>전체</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="statusFilter" style="font-size: 0.74rem; font-weight: 600; color: #475569;">상황:</label>
                <select id="statusFilter" class="select-filter" onchange="handleFilterChange()">
                    <option value="전체" selected>전체</option>
                    <option value="작성">작성</option>
                    <option value="완료">완료</option>
                    <option value="예정">예정</option>
                </select>
            </div>
        </div>
        <div id="body_postList" class="post-list-rows">
            <span style="font-size: 0.78rem; color: #64748b; padding: 4px 6px;">목록을 불러오는 중입니다...</span>
        </div>
    </div>

    <!-- 4. 작성 글 정보 (메타 표) -->
    <div id="sec_meta" class="meta-table-box">
        <div id="hdr_meta" class="meta-table-header">
            <span class="meta-table-title">
                <button type="button" id="arrow_meta" class="btn-section-toggle" onclick="toggleSection('meta')" title="열림/숨김">−</button>
                <span class="section-title" onclick="toggleFocusView('meta')" title="클릭 시 단독 집중 모드">작성 글 정보</span>
                <span id="badge_meta" class="badge-collapsed">숨김</span>
            </span>
        </div>
        <div id="body_meta">
            <table class="meta-grid-table">
                <tr>
                    <th>제목[ID]</th>
                    <td colspan="3">
                        <input type="text" id="essayTitleInput" placeholder="제목 입력" oninput="markDirty()" style="font-weight:700;">
                    </td>
                </tr>
                <tr>
                    <th>시작일</th>
                    <td><input type="text" id="postStartDate" placeholder="YYYY-MM-DD" oninput="markDirty()"></td>
                    <th>완료일</th>
                    <td><input type="text" id="postEndDate" placeholder="YYYY-MM-DD" oninput="markDirty()"></td>
                </tr>
                <tr>
                    <th>요약</th>
                    <td colspan="3">
                        <textarea id="postSummary" rows="2" placeholder="글 요약 (1~2줄)" oninput="markDirty()"></textarea>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 5. 7개 집필 창 동적 렌더링 컨테이너 -->
    <div id="editor-container" style="display:flex; flex-direction:column; gap:10px;"></div>

    <!-- API 키 관리 박스 (JS에 의해 '글의 의도'와 '요청 내용' 사이에 자동 삽입) -->
    <div id="sec_api" class="api-box">
        <div id="hdr_api" class="api-box-header">
            <div class="api-header-left">
                <button type="button" id="arrow_api" class="btn-section-toggle" onclick="toggleSection('api')" title="열림/숨김">−</button>
                <span class="api-section-title">
                    <span class="section-title" onclick="toggleFocusView('api')" title="클릭 시 단독 집중 모드">API 설정</span>
                </span>
                <span id="badge_api" class="badge-collapsed">숨김</span>
                <span id="apiStatusBadge" class="api-status-badge">⚠️ 키 미설정 상태</span>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="btn-key-compact" title="Google AI Studio 키 발급/관리 콘솔 열기">🔑</a>
            </div>
        </div>
        <div id="body_api" class="api-content-wrap">
            <div class="api-row">
                <input type="password" id="apiKeyInput" oninput="checkKeyInputState()">
                <div class="api-btn-group">
                    <div class="dropdown" id="apiDropdownContainer">
                        <button type="button" id="apiSaveBtn" class="api-save-btn" onclick="handleSaveButtonClick()">
                            <span id="apiSaveBtnText">키 설치하기</span>
                            <span id="dropdownArrow">▼</span>
                        </button>
                        <div id="apiDropdownMenu" class="dropdown-content">
                            <button type="button" onclick="selectKeyChoice('shared')">공용 키 설치하기</button>
                            <button type="button" onclick="selectKeyChoice('personal')">개인 키 설치하기</button>
                        </div>
                    </div>
                    <button type="button" id="apiCancelBtn" class="api-cancel-btn" onclick="cancelKeyInput()">취소</button>
                </div>
                <button type="button" id="apiDelBtn" class="api-del-btn" onclick="deleteApiKey()">키 삭제하기</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzFdIdTROi1QhNrIj6bpoiT6vLdkhD2jWoCiDyUSg5Zyj8uGGHVZqjUlbbqz-tmH37rjg/exec";
    const PUBLIC_SHARED_KEY = "__GEMINI_API_KEY__";
    const STORAGE_KEY = "WRITER_STUDIO_DATA_V10";
    const POSTS_CACHE_KEY = "WRITER_POSTS_CACHE_V03";
    const $ = function(id) { return document.getElementById(id); };

    let isDirty = false;
    let isPersonalWaitState = false;
    let currentPostId = null;
    let currentPostStatus = "작성";
    let postListCache = [];
    let currentFocusedKey = null; // 단독 집중 모드(Focus View) 상태 추적

    /* ==========================================================================
       데이터 주도 렌더링 설정 (포트란의 DO 루프 대상 파라미터 테이블)
       ========================================================================== */
    const SECTION_CONFIGS = [
        { key: 'outline',   id: 'essayOutline',   title: '글의 구성',      minH: 70,  stat: false, readTime: false, bullet: true },
        { key: 'completed', id: 'completedText',  title: '완성 글',        minH: 120, stat: true,  readTime: true,  bullet: false },
        { key: 'newDraft',  id: 'newDraftText',   title: '신규 글',        minH: 80,  stat: true,  readTime: true,  bullet: false },
        { key: 'intent',    id: 'draftIntent',    title: '글의 의도',      minH: 50,  stat: true,  readTime: false, bullet: false },
        { key: 'promptReq', id: 'promptReqText',  title: '요청 내용 (to AI)', minH: 50,  stat: true,  readTime: false, bullet: false },
        { key: 'aiRefined', id: 'aiRefinedText',  title: 'AI 수정 글',     minH: 90,  stat: true,  readTime: true,  bullet: false, isAi: true },
        { key: 'snippets',  id: 'savedSnippets',  title: '보관 글',        minH: 60,  stat: true,  readTime: false, bullet: true }
    ];

    const ALL_SECTION_KEYS = ['postList', 'meta', 'outline', 'completed', 'newDraft', 'intent', 'api', 'promptReq', 'aiRefined', 'snippets'];
    const fieldMap = {};
    const fieldState = {};
    SECTION_CONFIGS.forEach(function(c) { fieldMap[c.key] = c.id; });

    // 7개 집필 창 동적 생성 (컴포넌트 빌더 루프)
    function buildEditorSections() {
        const container = $('editor-container');
        const apiBox = $('sec_api');
        container.innerHTML = '';

        SECTION_CONFIGS.forEach(function(cfg) {
            const sec = document.createElement('div');
            sec.id = 'sec_' + cfg.key;
            sec.className = 'editor-section';

            // 헤더 조립
            const hdr = document.createElement('div');
            hdr.id = 'hdr_' + cfg.key;
            hdr.className = 'section-header-line';

            let extraAiButtons = '';
            if (cfg.isAi) {
                extraAiButtons = '<button type="button" class="btn-ai-req" onclick="requestAiRefine()">✨ AI 수정 요청</button>' +
                                 '<button type="button" class="btn-append-header" onclick="appendDraftToCompleted()">본문에 추가</button>';
            }

            hdr.innerHTML = '<div class="section-header-left">' +
                '<button type="button" id="arrow_' + cfg.key + '" class="btn-section-toggle" onclick="toggleSection(\'' + cfg.key + '\')" title="열림/숨김">−</button>' +
                '<span class="section-title" id="title_' + cfg.key + '" onclick="toggleFocusView(\'' + cfg.key + '\')" title="클릭 시 단독 집중 모드">' + cfg.title + '</span>' +
                '<span id="badge_' + cfg.key + '" class="badge-collapsed">숨김</span>' +
                '</div>' +
                '<div style="display:flex; align-items:center; gap:4px;">' +
                '<button type="button" id="copyBtn_' + cfg.key + '" class="btn-copy" onclick="copyContent(\'' + cfg.id + '\', this)">📋 복사</button>' +
                extraAiButtons +
                '</div>';

            // 본문 조립
            const body = document.createElement('div');
            body.id = 'body_' + cfg.key;
            body.className = 'editor-content-wrap';

            const bgStyle = cfg.isAi ? 'background-color: #f8fafc;' : '';
            const bulletAttr = cfg.bullet ? 'onkeydown="handleBulletEnter(event, this)"' : '';
            const statHtml = cfg.stat ? '<span class="stat-info" id="stat_' + cfg.key + '">0자</span>' : '<span></span>';

            body.innerHTML = '<textarea id="' + cfg.id + '" class="flat-textarea" style="min-height:' + cfg.minH + 'px; ' + bgStyle + '" ' + bulletAttr + ' oninput="handleFieldInput(\'' + cfg.key + '\')"></textarea>' +
                '<div class="editor-bottom-toolbar">' +
                statHtml +
                '<div class="restore-group">' +
                '<button type="button" class="btn-restore-icon" onclick="undoField(\'' + cfg.key + '\')">↺ 취소</button>' +
                '<button type="button" class="btn-restore-icon" onclick="restoreSaved(\'' + cfg.key + '\')">⟲ 최근 저장 상태로</button>' +
                '</div>' +
                '</div>';

            sec.appendChild(hdr);
            sec.appendChild(body);
            container.appendChild(sec);

            // '글의 의도' 바로 뒤에 API 설정 박스 끼워넣기
            if (cfg.key === 'intent') {
                container.appendChild(apiBox);
            }
        });
    }

    /* ==========================================================================
       소제목 클릭 시 '단독 집중 모드 (Focus View)' 토글 엔진
       ========================================================================== */
    function toggleFocusView(key) {
        if (currentFocusedKey === key) {
            // 이미 집중된 창을 다시 누르면: 전체 복원
            ALL_SECTION_KEYS.forEach(function(k) {
                const sec = $('sec_' + k);
                if (sec) sec.style.display = (k === 'meta' || k === 'postList') ? 'flex' : 'flex';
                const titleEl = $('title_' + k);
                if (titleEl) titleEl.classList.remove('is-focused');
            });
            const actionToolbar = $('mainActionToolbar');
            if (actionToolbar) actionToolbar.style.display = 'flex';
            currentFocusedKey = null;
            resizeAllTextareas();
        } else {
            // 특정 창만 화면에 단독 표시
            ALL_SECTION_KEYS.forEach(function(k) {
                const sec = $('sec_' + k);
                if (sec) {
                    sec.style.display = (k === key) ? 'flex' : 'none';
                }
                const titleEl = $('title_' + k);
                if (titleEl) {
                    if (k === key) titleEl.classList.add('is-focused');
                    else titleEl.classList.remove('is-focused');
                }
            });
            currentFocusedKey = key;

            // 선택된 창이 접혀있었다면 자동으로 펼침
            const bodyEl = $('body_' + key);
            if (bodyEl && bodyEl.style.display === 'none') {
                toggleSection(key);
            }
            resizeAllTextareas();
        }
    }

    /* ==========================================================================
       초기화 및 공통 이벤트
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', function() {
        buildEditorSections();
        initFieldStates();
        loadSavedData();
        checkApiKeyStatus();
        updateAllStats();
        loadCachedPosts();
        fetchSheetPosts();

        window.onclick = function(e) {
            if (!e.target.closest('.api-save-btn') && !e.target.closest('.dropdown-content')) {
                document.querySelectorAll(".dropdown-content.show").forEach(function(el) {
                    el.classList.remove('show');
                });
            }
        };
    });

    function markDirty() { isDirty = true; }

    function autoResizeTextarea(textarea, minH) {
        if (!textarea) return;
        const baseH = minH || 50;
        textarea.style.height = 'auto';
        textarea.style.height = Math.max(textarea.scrollHeight, baseH) + 'px';
    }

    function copyContent(elementId, btn) {
        const el = $(elementId);
        if (!el || !el.value.trim()) return alert('복사할 내용이 없습니다.');
        navigator.clipboard.writeText(el.value).then(function() {
            const originalText = btn.innerText;
            btn.innerText = '✓ 복사됨';
            btn.style.color = '#16a34a';
            setTimeout(function() { btn.innerText = originalText; btn.style.color = ''; }, 1500);
        });
    }

    function toggleSection(key) {
        const bodyEl = $('body_' + key);
        const dot = $('dot_' + key);
        const arrow = $('arrow_' + key);
        const badge = $('badge_' + key);
        const hdr = $('hdr_' + key);
        const copyBtn = $('copyBtn_' + key);
        if (!bodyEl) return;

        const isClosed = bodyEl.style.display === 'none';
        if (isClosed) {
            bodyEl.style.display = (key === 'meta') ? 'block' : 'flex';
            if (dot) dot.classList.remove('is-closed');
            if (arrow) { arrow.innerText = '−'; arrow.classList.remove('is-closed'); }
            if (badge) badge.classList.remove('show');
            if (hdr) hdr.classList.remove('header-collapsed-line');
            if (copyBtn) copyBtn.style.display = 'inline-flex';
        } else {
            bodyEl.style.display = 'none';
            if (dot) dot.classList.add('is-closed');
            if (arrow) { arrow.innerText = '+'; arrow.classList.add('is-closed'); }
            if (badge) badge.classList.add('show');
            if (hdr) hdr.classList.add('header-collapsed-line');
            if (copyBtn) copyBtn.style.display = 'none';
        }
    }

    /* ==========================================================================
       작성 글 목록 (test.html v1.4 완전 통합)
       ========================================================================== */
    function loadCachedPosts() {
        const cached = localStorage.getItem(POSTS_CACHE_KEY);
        if (cached) {
            try {
                postListCache = JSON.parse(cached);
                populateCategoryFilter();
                renderPostList();
            } catch (e) { console.error(e); }
        }
    }

    function fetchSheetPosts() {
        const oldScript = document.getElementById('gas_jsonp_script');
        if (oldScript) oldScript.remove();

        window.handleGasResponse = function(response) {
            if (response && response.status === "success" && response.data) {
                postListCache = response.data;
                localStorage.setItem(POSTS_CACHE_KEY, JSON.stringify(postListCache));
                populateCategoryFilter();
                renderPostList();
            }
        };

        const script = document.createElement('script');
        script.id = 'gas_jsonp_script';
        script.src = GAS_ENDPOINT + '?callback=handleGasResponse&_t=' + new Date().getTime();
        document.body.appendChild(script);
    }

    function populateCategoryFilter() {
        const select = $('categoryFilter');
        const currentVal = select.value;
        const categories = new Set();

        postListCache.forEach(function(item) {
            const cat = (item.분류 || item.category || '').trim();
            if (cat) categories.add(cat);
        });

        select.innerHTML = '<option value="전체">전체</option>';
        categories.forEach(function(cat) {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);
        });

        select.value = Array.from(categories).includes(currentVal) ? currentVal : '전체';
    }

    function handleFilterChange() {
        currentPostId = null;
        // 필터 변경 시 전체 집필창 초기화
        SECTION_CONFIGS.forEach(function(cfg) {
            const el = $(cfg.id);
            if (el) {
                el.value = '';
                fieldState[cfg.key] = { currentSaved: '', history: [''] };
                autoResizeTextarea(el, cfg.minH);
            }
        });
        updateAllStats();
        renderPostList();
    }

    function renderPostList() {
        const grid = $('body_postList');
        const statusFilter = $('statusFilter').value;
        const categoryFilter = $('categoryFilter').value;
        grid.innerHTML = '';

        const filtered = postListCache.filter(function(item) {
            const itemStatus = (item.상황 || item.status || '작성').trim();
            const itemCategory = (item.분류 || item.category || '').trim();
            const matchStatus = (statusFilter === '전체') || (itemStatus === statusFilter);
            const matchCategory = (categoryFilter === '전체') || (itemCategory === categoryFilter);
            return matchStatus && matchCategory;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<span style="font-size:0.78rem; color:#64748b; padding:4px 6px;">해당 조건의 글이 없습니다.</span>';
            return;
        }

        filtered.forEach(function(post) {
            const postId = post.ID || post.id || '';
            const postTitle = post.제목 || post.title || '(제목 없음)';
            const postStatus = (post.상황 || post.status || '작성').trim();
            const postCategory = (post.분류 || post.category || '').trim();

            const row = document.createElement('div');
            row.className = 'post-row-item' + (currentPostId === postId ? ' active' : '');

            const titleArea = document.createElement('div');
            titleArea.className = 'post-row-title-area';

            const categoryText = postCategory || '-';
            titleArea.innerHTML = '<span class="post-category-tag" title="' + categoryText + '">' + categoryText + '</span>' +
                                  '<span class="post-row-title" title="' + postTitle + '">' + postTitle + '</span>';
            titleArea.onclick = function() { selectPost(post); };

            let statusClass = 'status-writing';
            if (postStatus === '완료') statusClass = 'status-done';
            else if (postStatus === '예정') statusClass = 'status-plan';

            const statusBtn = document.createElement('button');
            statusBtn.type = 'button';
            statusBtn.className = 'btn-status-toggle ' + statusClass;
            statusBtn.innerText = postStatus;
            statusBtn.title = "클릭 시 상황 변경 (작성 -> 완료 -> 예정)";
            statusBtn.onclick = function(e) {
                e.stopPropagation();
                togglePostStatus(post);
            };

            row.appendChild(titleArea);
            row.appendChild(statusBtn);
            grid.appendChild(row);
        });
    }

    function togglePostStatus(post) {
        const current = (post.상황 || post.status || '작성').trim();
        let nextStatus = '작성';
        if (current === '작성') nextStatus = '완료';
        else if (current === '완료') nextStatus = '예정';
        else if (current === '예정') nextStatus = '작성';

        post.상황 = nextStatus;
        post.status = nextStatus;

        if (currentPostId === (post.ID || post.id)) {
            currentPostStatus = nextStatus;
        }

        localStorage.setItem(POSTS_CACHE_KEY, JSON.stringify(postListCache));
        renderPostList();

        fetch(GAS_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                ID: post.ID || post.id,
                id: post.ID || post.id,
                status: nextStatus,
                category: post.분류 || post.category || '',
                title: post.제목 || post.title || '',
                outline: post.글의구성 || post['글의 구성'] || post.outline || ''
            })
        });
    }

    // 1. 글 선택 시 시트 전체 내용 모든 창에 자동 매핑 (완성글, 신규글, 의도 등 전 필드)
    function selectPost(post) {
        if (isDirty && !confirm('작성 중인 변경 사항이 있습니다. 저장하지 않고 다른 글로 전환하시겠습니까?')) {
            return;
        }

        currentPostId = post.ID || post.id || '';
        currentPostStatus = (post.상황 || post.status || '작성').trim();

        // 메타 정보
        $('essayTitleInput').value = post.제목 || post.title || '';
        $('postStartDate').value = post.작성시작일 || post['작성 시작일'] || post.startDate || '';
        $('postEndDate').value = post.작성완료일 || post['작성 완료일'] || post.endDate || '';
        $('postSummary').value = post.요약 || post.summary || '';

        // 7개 집필 영역 다각도 헤더 키 안전 매핑
        $('essayOutline').value  = post.글의구성 || post['글의 구성'] || post['글의\n구성'] || post.outline || '';
        $('completedText').value = post.완성글 || post['완성 글'] || post['완성\n글'] || post.completed || '';
        $('newDraftText').value  = post.신규글 || post['신규 글'] || post['신규\n글'] || post.newDraft || '';
        $('draftIntent').value   = post.글의의도 || post['글의 의도'] || post['글의\n의도'] || post.intent || '';
        $('promptReqText').value = post.요청내용 || post['요청 내용'] || post['요청\n내용'] || post.promptReq || '';
        $('aiRefinedText').value = post.AI수정글 || post['AI 수정 글'] || post['AI수정 글'] || post.aiRefined || '';
        $('savedSnippets').value = post.보관글 || post['보관 글'] || post['보관\n글'] || post.snippets || '';

        initFieldStates();
        updateAllStats();
        resizeAllTextareas();
        renderPostList();
        isDirty = false;
    }

    function resizeAllTextareas() {
        SECTION_CONFIGS.forEach(function(cfg) {
            const el = $(cfg.id);
            if (el) autoResizeTextarea(el, cfg.minH);
        });
    }

    /* ==========================================================================
       복원(Undo) 스택 및 편집 제어
       ========================================================================== */
    function initFieldStates() {
        SECTION_CONFIGS.forEach(function(cfg) {
            const el = $(cfg.id);
            const val = el ? el.value : '';
            fieldState[cfg.key] = { currentSaved: val, history: [val] };
        });
    }

    function handleFieldInput(key) {
        markDirty();
        const cfg = SECTION_CONFIGS.find(function(c) { return c.key === key; });
        const el = $(cfg.id);
        if (!el) return;

        const val = el.value;
        const stack = fieldState[key].history;
        if (stack[stack.length - 1] !== val) {
            stack.push(val);
            if (stack.length > 50) stack.shift();
        }
        autoResizeTextarea(el, cfg.minH);
        updateStat(key, val);
    }

    function undoField(key) {
        const cfg = SECTION_CONFIGS.find(function(c) { return c.key === key; });
        const el = $(cfg.id);
        if (!el || !fieldState[key]) return;
        const stack = fieldState[key].history;
        if (stack.length > 1) {
            stack.pop();
            el.value = stack[stack.length - 1];
            autoResizeTextarea(el, cfg.minH);
            updateStat(key, el.value);
            markDirty();
        } else {
            alert('되돌릴 이전 입력 내용이 없습니다.');
        }
    }

    function restoreSaved(key) {
        const cfg = SECTION_CONFIGS.find(function(c) { return c.key === key; });
        const el = $(cfg.id);
        if (!el || !fieldState[key]) return;
        const targetVal = fieldState[key].currentSaved;
        if (el.value === targetVal) return alert('이미 최근 저장된 상태와 동일합니다.');
        fieldState[key].history.push(targetVal);
        el.value = targetVal;
        autoResizeTextarea(el, cfg.minH);
        updateStat(key, targetVal);
        markDirty();
    }

    function handleBulletEnter(e, textarea) {
        if (e.key === 'Enter') {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const value = textarea.value;
            const lineStart = value.lastIndexOf('\n', start - 1) + 1;
            const currentLine = value.substring(lineStart, start);

            if (currentLine.trim().startsWith('●')) {
                e.preventDefault();
                if (currentLine.trim() === '●') {
                    const before = value.substring(0, lineStart);
                    const after = value.substring(end);
                    textarea.value = before + after;
                    textarea.selectionStart = textarea.selectionEnd = lineStart;
                    return;
                }
                const bullet = '\n● ';
                textarea.value = value.substring(0, start) + bullet + value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + bullet.length;
                textarea.dispatchEvent(new Event('input'));
            }
        }
    }

    function updateStat(key, text) {
        const cfg = SECTION_CONFIGS.find(function(c) { return c.key === key; });
        if (!cfg || !cfg.stat) return;
        const statEl = $('stat_' + key);
        if (!statEl) return;

        const len = text.length;
        if (cfg.readTime) {
            const readingTime = Math.ceil(len / 400);
            statEl.innerText = len.toLocaleString() + '자 (약 ' + readingTime + '분)';
        } else {
            statEl.innerText = len.toLocaleString() + '자';
        }
    }

    function updateAllStats() {
        SECTION_CONFIGS.forEach(function(cfg) {
            const el = $(cfg.id);
            if (el) updateStat(cfg.key, el.value);
        });
    }

    function appendDraftToCompleted() {
        const textToAppend = $('aiRefinedText').value.trim() || $('newDraftText').value.trim();
        if (!textToAppend) return alert('이어 붙일 내용이 없습니다.');

        const completedEl = $('completedText');
        completedEl.value = completedEl.value.trim() ? completedEl.value.trim() + "\n\n" + textToAppend : textToAppend;
        handleFieldInput('completed');

        ['newDraft', 'intent', 'promptReq', 'aiRefined'].forEach(function(k) {
            const el = $(fieldMap[k]);
            if (el) { el.value = ''; handleFieldInput(k); }
        });
    }

    /* ==========================================================================
       저장 (로컬 스토리지 + 구글 시트 C열 '분류' 포함 양방향 동기화)
       ========================================================================== */
    async function saveWork(mode) {
        const titleVal = $('essayTitleInput').value.trim();
        if (!titleVal) return alert('제목을 입력해주세요.');

        if (!currentPostId) currentPostId = "ID_" + new Date().getTime();

        const currentCategory = $('categoryFilter').value !== '전체' ? $('categoryFilter').value : '';

        const payload = {
            ID: currentPostId,
            id: currentPostId,
            status: currentPostStatus || "작성",
            category: currentCategory,
            title: titleVal,
            startDate: $('postStartDate').value.trim(),
            endDate: $('postEndDate').value.trim(),
            summary: $('postSummary').value.trim(),
            outline: $('essayOutline').value,
            completed: $('completedText').value,
            newDraft: $('newDraftText').value,
            intent: $('draftIntent').value,
            promptReq: $('promptReqText').value,
            aiRefined: $('aiRefinedText').value,
            snippets: $('savedSnippets').value,
            updatedAt: new Date().toISOString()
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        SECTION_CONFIGS.forEach(function(cfg) {
            const el = $(cfg.id);
            if (el && fieldState[cfg.key]) fieldState[cfg.key].currentSaved = el.value;
        });
        isDirty = false;

        try {
            fetch(GAS_ENDPOINT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(function() { fetchSheetPosts(); });
        } catch (err) {
            console.error("구글 시트 저장 통신 오류:", err);
        }

        if (mode === 'stay') {
            alert('구글 시트 및 로컬에 안전하게 저장되었습니다.');
        } else if (mode === 'exit') {
            if (confirm('저장되었습니다. 창을 닫으시겠습니까?')) window.close();
        }
    }

    function loadSavedData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        try {
            const data = JSON.parse(raw);
            if (data.ID || data.id) currentPostId = data.ID || data.id;
            if (data.status) currentPostStatus = data.status;
            if (data.title) $('essayTitleInput').value = data.title;
            if (data.startDate) $('postStartDate').value = data.startDate;
            if (data.endDate) $('postEndDate').value = data.endDate;
            if (data.summary) $('postSummary').value = data.summary;

            SECTION_CONFIGS.forEach(function(cfg) {
                if (data[cfg.key]) $(cfg.id).value = data[cfg.key];
            });
            initFieldStates();
            resizeAllTextareas();
        } catch(e) { console.error("데이터 로드 실패", e); }
    }

    function cancelWork() {
        if (isDirty) {
            if (confirm('작성 중인 내용이 저장되지 않았습니다. 취소하고 마지막 저장 상태로 되돌리시겠습니까?')) {
                loadSavedData();
                isDirty = false;
            }
        } else {
            alert('변경된 내용이 없습니다.');
        }
    }

    function cancelAndClose() {
        if (isDirty) {
            if (confirm('저장되지 않은 변경사항이 있습니다. 그래도 닫으시겠습니까?')) window.close();
        } else {
            window.close();
        }
    }

    /* ==========================================================================
       API Key 및 Gemini AI 파이프라인
       ========================================================================== */
    function checkApiKeyStatus() {
        const savedKey = localStorage.getItem("GEMINI_USER_API_KEY");
        const keyType = localStorage.getItem("GEMINI_KEY_TYPE");
        const badge = $("apiStatusBadge");

        if (savedKey) {
            isPersonalWaitState = false;
            $("apiKeyInput").value = savedKey;
            $("apiDelBtn").style.display = "inline-block";
            $("apiSaveBtn").classList.remove("api-wait-btn");
            $("apiCancelBtn").style.display = "none";
            $("dropdownArrow").style.display = "none";
            $("apiSaveBtn").disabled = true;

            if (keyType === "personal") {
                $("apiSaveBtnText").innerText = "개인 키 설치완료";
                badge.innerText = "🔒 개인 키 사용 중";
                Object.assign(badge.style, { color: "#16a34a", background: "#dcfce7", borderColor: "#86efac" });
            } else {
                $("apiSaveBtnText").innerText = "공용 키 설치완료";
                badge.innerText = "🟢 공용 키 사용 중";
                Object.assign(badge.style, { color: "#d97706", background: "#fef3c7", borderColor: "#fde68a" });
            }
        } else {
            $("apiKeyInput").value = "";
            $("apiDelBtn").style.display = "none";
            $("apiSaveBtn").disabled = false;
            $("apiSaveBtn").classList.remove("api-wait-btn");
            badge.innerText = "⚠️ 키 미설정 상태";
            Object.assign(badge.style, { color: "#dc2626", background: "#fee2e2", borderColor: "#fca5a5" });

            if (isPersonalWaitState) {
                $("apiSaveBtnText").innerText = "개인 키 설치대기";
                $("dropdownArrow").style.display = "none";
                $("apiSaveBtn").classList.add("api-wait-btn");
                $("apiCancelBtn").style.display = "inline-block";
            } else {
                checkKeyInputState();
            }
        }
    }

    function checkKeyInputState() {
        if (localStorage.getItem("GEMINI_USER_API_KEY") || isPersonalWaitState) return;
        const hasInput = $("apiKeyInput").value.trim().length > 0;
        $("apiSaveBtnText").innerText = hasInput ? "개인 키 설치하기" : "키 설치하기";
        $("dropdownArrow").style.display = hasInput ? "none" : "inline";
        $("apiCancelBtn").style.display = hasInput ? "inline-block" : "none";
    }

    function handleSaveButtonClick() {
        if (localStorage.getItem("GEMINI_USER_API_KEY")) return;
        const keyVal = $("apiKeyInput").value.trim();
        if (isPersonalWaitState || keyVal.length > 0) {
            if (keyVal.length === 0) {
                alert("API Key를 입력한 뒤 눌러주세요.");
                return $("apiKeyInput").focus();
            }
            localStorage.setItem("GEMINI_USER_API_KEY", keyVal);
            localStorage.setItem("GEMINI_KEY_TYPE", "personal");
            isPersonalWaitState = false;
            checkApiKeyStatus();
        } else {
            $("apiDropdownMenu").classList.toggle("show");
        }
    }

    function selectKeyChoice(type) {
        $("apiDropdownMenu").classList.remove('show');
        if (type === 'shared') {
            if (PUBLIC_SHARED_KEY && !PUBLIC_SHARED_KEY.startsWith("__")) {
                localStorage.setItem("GEMINI_USER_API_KEY", PUBLIC_SHARED_KEY);
                localStorage.setItem("GEMINI_KEY_TYPE", "shared");
                isPersonalWaitState = false;
                checkApiKeyStatus();
            } else {
                alert("공용 키가 설정되어 있지 않습니다.");
            }
        } else if (type === 'personal') {
            const keyVal = $("apiKeyInput").value.trim();
            if (keyVal.length > 0) {
                localStorage.setItem("GEMINI_USER_API_KEY", keyVal);
                localStorage.setItem("GEMINI_KEY_TYPE", "personal");
                isPersonalWaitState = false;
                checkApiKeyStatus();
            } else {
                isPersonalWaitState = true;
                checkApiKeyStatus();
                $("apiKeyInput").focus();
            }
        }
    }

    function cancelKeyInput() {
        isPersonalWaitState = false;
        $("apiKeyInput").value = "";
        checkApiKeyStatus();
    }

    function deleteApiKey() {
        if (confirm("저장된 API Key를 삭제하시겠습니까?")) {
            localStorage.removeItem("GEMINI_USER_API_KEY");
            localStorage.removeItem("GEMINI_KEY_TYPE");
            isPersonalWaitState = false;
            checkApiKeyStatus();
            $("apiKeyInput").focus();
        }
    }

    async function requestAiRefine() {
        const apiKey = localStorage.getItem("GEMINI_USER_API_KEY");
        if (!apiKey) return alert('Gemini API Key를 먼저 설치해주세요.');

        const completed = $('completedText').value.trim();
        const newDraft = $('newDraftText').value.trim();
        const intent = $('draftIntent').value.trim();
        const promptReq = $('promptReqText').value.trim();

        if (!newDraft) return alert('신규 글을 먼저 작성해주세요.');

        const prompt = "당신은 유려한 감성과 논리적인 구조를 겸비한 전문 글쓰기 편집자이자 라이팅 코치입니다.\n" +
            "다음 정보들을 분석하여 신규 글을 검토하고 퇴고안을 작성해주세요.\n\n" +
            "[이제까지 작성 완료된 글]:\n" + (completed || "(첫 단락입니다)") + "\n\n" +
            "[신규 작성한 글]:\n" + newDraft + "\n\n" +
            "[글의 의도]:\n" + (intent || "(별도 의도 없음)") + "\n\n" +
            "[AI에게 바라는 구체적 요청 사항]:\n" + (promptReq || "(기본 자연스러운 흐름 퇴고 요망)") + "\n\n" +
            "[수정 가이드]:\n" +
            "1. 신규 글의 의도와 구체적인 요청 사항을 충실히 반영하여, 이제까지 작성 완료된 글의 흐름에 이 글이 자연스러운지 채택 여부를 먼저 판단하세요.\n" +
            "2. 사용하기로 했다면, 요청 사항에 맞춰 유려하고 정돈된 문체로 수정 완성 단락을 작성해 주세요.\n" +
            "3. 출력 형식:\n- 채택 판단 코멘트(1줄)\n- [수정 완성 단락]";

        const aiRefinedEl = $('aiRefinedText');
        aiRefinedEl.value = "AI 검토 및 퇴고 중입니다...";

        try {
            const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                aiRefinedEl.value = data.candidates[0].content.parts[0].text;
                handleFieldInput('aiRefined');
            } else {
                aiRefinedEl.value = "수정안 생성에 실패했습니다.";
            }
        } catch (err) {
            console.error(err);
            aiRefinedEl.value = "통신 중 오류가 발생했습니다.";
        }
    }
</script>
