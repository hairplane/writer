<!-- v0.5: 헤더를 macOS 윈도우 타이틀바 스타일(신호등 3색 버튼, 중앙 정렬 타이틀바)로 전면 개편하여 본문 영역과 시각적 분리 완성 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 스튜디오</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            word-break: keep-all;
            padding: 16px 20px 40px;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 1. macOS 윈도우 스타일 헤더 */
        header.mac-window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            border: 1px solid #cbd5e1;
            border-bottom: 1.5px solid #94a3b8;
            padding: 8px 14px;
            border-radius: 10px 10px 8px 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            user-select: none;
        }

        /* 신호등 3색 점 */
        .window-controls {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 70px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            border: 0.5px solid rgba(0, 0, 0, 0.12);
        }
        .dot:hover { opacity: 0.8; transform: scale(1.1); }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        /* 타이틀 바 중앙 정렬 */
        .header-title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }

        .header-title-wrap h1 {
            font-size: 0.96rem;
            font-weight: 700;
            color: #334155;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title-wrap .version-tag {
            font-size: 0.72rem;
            color: #2563eb;
            font-weight: 700;
            background: #ffffff;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid #bfdbfe;
        }

        .header-dummy-right {
            width: 70px; /* 좌측 신호등과 대칭을 맞추기 위한 여백 */
        }

        /* 2. 헤더 하단 컴팩트 액션 툴바 */
        .action-toolbar-clean {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 0 2px;
        }

        .btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 5px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-default {
            background: #ffffff;
            border-color: var(--border-color);
            color: var(--text-main);
        }
        .btn-default:hover { background-color: #f1f5f9; }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-danger {
            background: #ffffff;
            border-color: #fca5a5;
            color: #dc2626;
        }
        .btn-danger:hover { background-color: #fef2f2; }

        /* 3. API 키 관리 박스 (테두리 유지 + 토글 접기/펼치기) */
        .api-box {
            background: #fffdf5;
            border: 1px solid #fde68a;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .api-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .api-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-status-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: #d97706;
            background: #fef3c7;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #fde68a;
            display: inline-block;
        }

        .btn-key-compact {
            background: #ffffff;
            color: #d97706;
            border: 1px solid #fde68a;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-key-compact:hover {
            background: #fef3c7;
            transform: scale(1.05);
        }

        .btn-api-toggle {
            background: none;
            border: none;
            color: #92400e;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .btn-api-toggle:hover { background: #fef3c7; }

        .api-row {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            flex-wrap: wrap;
        }

        .api-row input {
            flex: 1;
            min-width: 200px;
            padding: 7px 10px;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            outline: none;
            background: #fff;
        }
        .api-row input:focus { border-color: #d97706; }

        .api-btn-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dropdown { position: relative; display: inline-block; }

        .api-save-btn {
            background: #f57c00;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .api-save-btn:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        .api-wait-btn { background: #e67e22 !important; }

        .api-cancel-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: #ffffff;
            min-width: 150px;
            box-shadow: 0px 6px 14px rgba(0,0,0,0.12);
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            z-index: 50;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #334155;
            padding: 8px 12px;
            text-align: left;
            background: none;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: block;
        }
        .dropdown-content button:hover {
            background-color: #f8fafc;
            color: #f57c00;
        }
        .dropdown-content.show { display: block; }

        .api-del-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }
        .api-del-btn:hover { background-color: #dc2626; }

        /* 4. 제목 한 줄 배치 */
        .title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .title-row label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
        }

        .title-row input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            font-weight: 600;
            background: transparent;
        }

        /* 5. 개별 집필 영역 (테두리 카드 제거, 플랫 미니멀) */
        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 2px;
        }

        .section-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 2px;
        }

        .section-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #334155;
        }

        textarea.flat-textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.94rem;
            line-height: 1.6;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #ffffff;
            outline: none;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        textarea.flat-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        #essayOutline {
            font-size: 0.9rem;
            letter-spacing: -0.01em;
        }

        /* 상태 툴바 (글자 수, 복원 버튼) */
        .status-toolbar-flat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            color: var(--text-sub);
            padding: 2px 2px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .stat-info {
            font-weight: 500;
        }

        .restore-group {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .btn-restore-icon {
            background: #ffffff;
            border: 1px solid var(--border-light);
            color: #475569;
            font-size: 0.74rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .btn-restore-icon:hover {
            background-color: #f1f5f9;
            color: #0f172a;
            border-color: var(--border-color);
        }

        /* 6. AI 수정 글 전용 버튼 */
        .btn-ai-req {
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-ai-req:hover { background: #4338ca; }

        .btn-append-header {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-append-header:hover { background: #0369a1; }

        @media (max-width: 640px) {
            body { padding: 10px 12px 30px; }
            .action-toolbar-clean { justify-content: flex-start; }
            .section-header-line { flex-wrap: wrap; gap: 6px; }
            .window-controls { width: 50px; }
            .header-dummy-right { width: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. macOS 윈도우 스타일 헤더 -->
    <header class="mac-window-header">
        <!-- 좌측 신호등 3색 버튼 (빨강: 창닫기, 노랑: API키창 접기/펼치기, 초록: 팁) -->
        <div class="window-controls">
            <span class="dot dot-red" onclick="cancelAndClose()" title="창 닫기"></span>
            <span class="dot dot-yellow" onclick="toggleApiBox()" title="API 설정창 접기/펼치기"></span>
            <span class="dot dot-green" onclick="alert('글쓰기 스튜디오가 활성화되어 있습니다.')" title="상태 정상"></span>
        </div>

        <!-- 중앙 타이틀바 -->
        <div class="header-title-wrap">
            <h1>✍️ 글쓰기 스튜디오</h1>
            <span class="version-tag">v0.5</span>
        </div>

        <!-- 우측 여백 밸런스용 빈 블록 -->
        <div class="header-dummy-right"></div>
    </header>

    <!-- 2. 헤더 하단 독립 액션 버튼 -->
    <div class="action-toolbar-clean">
        <button type="button" class="btn btn-default" onclick="saveWork('stay')">저장/계속</button>
        <button type="button" class="btn btn-primary" onclick="saveWork('exit')">저장/종료</button>
        <button type="button" class="btn btn-danger" onclick="cancelWork()">취소</button>
    </div>

    <!-- 3. API 키 관리 (테두리 유지 + 접기/펼치기 토글 + 열쇠 아이콘) -->
    <div id="apiBox" class="api-box">
        <div class="api-box-header">
            <div class="api-header-left">
                <span id="apiStatusBadge" class="api-status-badge">⚠️ 키 미설정 상태</span>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="btn-key-compact" title="Google AI Studio 키 발급/관리 콘솔 열기">
                    🔑
                </a>
            </div>
            <button type="button" id="btnApiToggle" class="btn-api-toggle" onclick="toggleApiBox()">접기 ▲</button>
        </div>
        <div id="apiBoxBody" class="api-row">
            <input type="password" id="apiKeyInput" oninput="checkKeyInputState()">
            <div class="api-btn-group">
                <div class="dropdown" id="apiDropdownContainer">
                    <button type="button" id="apiSaveBtn" class="api-save-btn" onclick="handleSaveButtonClick()">
                        <span id="apiSaveBtnText">키 설치하기</span>
                        <span id="dropdownArrow">▼</span>
                    </button>
                    <div id="apiDropdownMenu" class="dropdown-content">
                        <button type="button" onclick="selectKeyChoice('shared')">공용 키 설치하기</button>
                        <button type="button" onclick="selectKeyChoice('personal')">개인 키 설치하기</button>
                    </div>
                </div>
                <button type="button" id="apiCancelBtn" class="api-cancel-btn" onclick="cancelKeyInput()">취소</button>
            </div>
            <button type="button" id="apiDelBtn" class="api-del-btn" onclick="deleteApiKey()">키 삭제하기</button>
        </div>
    </div>

    <!-- 4. 제목 한 줄 배치 -->
    <div class="title-row">
        <label for="essayTitle">제목:</label>
        <input type="text" id="essayTitle" oninput="markDirty()">
    </div>

    <!-- 5. 글의 구성 (작은 글머리) -->
    <div class="editor-section">
        <div class="section-header-line">
            <span class="section-title">글의 구성</span>
            <div class="restore-group">
                <button type="button" class="btn-restore-icon" onclick="undoField('outline')">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSaved('outline')">⟲ 최근 저장 상태로</button>
            </div>
        </div>
        <textarea id="essayOutline" class="flat-textarea" style="min-height: 80px;" onkeydown="handleBulletEnter(event, this)" oninput="handleFieldInput('outline')"></textarea>
    </div>

    <!-- 6. 완성 글 -->
    <div class="editor-section">
        <div class="section-header-line">
            <span class="section-title">완성 글</span>
        </div>
        <textarea id="completedText" class="flat-textarea" style="min-height: 140px;" oninput="handleFieldInput('completed')"></textarea>
        <div class="status-toolbar-flat">
            <span class="stat-info" id="stat_completed">0자 (약 0분)</span>
            <div class="restore-group">
                <button type="button" class="btn-restore-icon" onclick="undoField('completed')">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSaved('completed')">⟲ 최근 저장 상태로</button>
            </div>
        </div>
    </div>

    <!-- 7. 신규 글 -->
    <div class="editor-section">
        <div class="section-header-line">
            <span class="section-title">신규 글</span>
        </div>
        <textarea id="newDraftText" class="flat-textarea" style="min-height: 100px;" oninput="handleFieldInput('newDraft')"></textarea>
        <div class="status-toolbar-flat">
            <span class="stat-info" id="stat_newDraft">0자 (약 0분)</span>
            <div class="restore-group">
                <button type="button" class="btn-restore-icon" onclick="undoField('newDraft')">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSaved('newDraft')">⟲ 최근 저장 상태로</button>
            </div>
        </div>
    </div>

    <!-- 8. 글의 의도 -->
    <div class="editor-section">
        <div class="section-header-line">
            <span class="section-title">글의 의도</span>
        </div>
        <textarea id="draftIntent" class="flat-textarea" style="min-height: 60px;" oninput="handleFieldInput('intent')"></textarea>
        <div class="status-toolbar-flat">
            <span class="stat-info" id="stat_intent">0자</span>
            <div class="restore-group">
                <button type="button" class="btn-restore-icon" onclick="undoField('intent')">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSaved('intent')">⟲ 최근 저장 상태로</button>
            </div>
        </div>
    </div>

    <!-- 9. AI 수정 글 -->
    <div class="editor-section">
        <div class="section-header-line">
            <div class="section-header-left">
                <span class="section-title">AI 수정 글</span>
                <button type="button" class="btn-ai-req" onclick="requestAiRefine()">✨ AI 수정 요청</button>
            </div>
            <button type="button" class="btn-append-header" onclick="appendDraftToCompleted()">본문에 추가</button>
        </div>
        <textarea id="aiRefinedText" class="flat-textarea" style="min-height: 110px; background-color: #f8fafc;" oninput="handleFieldInput('aiRefined')"></textarea>
        <div class="status-toolbar-flat">
            <span class="stat-info" id="stat_aiRefined">0자 (약 0분)</span>
            <div class="restore-group">
                <button type="button" class="btn-restore-icon" onclick="undoField('aiRefined')">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSaved('aiRefined')">⟲ 최근 저장 상태로</button>
            </div>
        </div>
    </div>

    <!-- 10. 보관 글 -->
    <div class="editor-section">
        <div class="section-header-line">
            <span class="section-title">보관 글</span>
        </div>
        <textarea id="savedSnippets" class="flat-textarea" style="min-height: 80px;" onkeydown="handleBulletEnter(event, this)" oninput="handleFieldInput('snippets')"></textarea>
        <div class="status-toolbar-flat">
            <span class="stat-info" id="stat_snippets">0자</span>
            <div class="restore-group">
                <button type="button" class="btn-restore-icon" onclick="undoField('snippets')">↺ 취소</button>
                <button type="button" class="btn-restore-icon" onclick="restoreSaved('snippets')">⟲ 최근 저장 상태로</button>
            </div>
        </div>
    </div>
</div>

<script>
    const PUBLIC_SHARED_KEY = "__GEMINI_API_KEY__";
    const STORAGE_KEY = "WRITER_STUDIO_DATA_V05";
    const $ = id => document.getElementById(id);

    let isDirty = false;
    let isPersonalWaitState = false;

    const fieldMap = {
        outline: 'essayOutline',
        completed: 'completedText',
        newDraft: 'newDraftText',
        intent: 'draftIntent',
        aiRefined: 'aiRefinedText',
        snippets: 'savedSnippets'
    };

    let fieldState = {};

    window.addEventListener('DOMContentLoaded', () => {
        initFieldStates();
        loadSavedData();
        checkApiKeyStatus();
        updateAllStats();

        window.onclick = (e) => {
            if (!e.target.closest('.api-save-btn') && !e.target.closest('.dropdown-content')) {
                document.querySelectorAll(".dropdown-content.show").forEach(el => el.classList.remove('show'));
            }
        };
    });

    function markDirty() { isDirty = true; }

    /* ==========================================================================
       API Key 관리 시스템 및 토글
       ========================================================================== */
    function toggleApiBox() {
        const body = $('apiBoxBody');
        const btn = $('btnApiToggle');
        const isHidden = body.style.display === 'none';
        body.style.display = isHidden ? 'flex' : 'none';
        btn.innerText = isHidden ? '접기 ▲' : '펼치기 ▼';
    }

    function checkApiKeyStatus() {
        const savedKey = localStorage.getItem("GEMINI_USER_API_KEY");
        const keyType = localStorage.getItem("GEMINI_KEY_TYPE");
        const badge = $("apiStatusBadge");

        if (savedKey) {
            isPersonalWaitState = false;
            $("apiKeyInput").value = savedKey;
            $("apiDelBtn").style.display = "inline-block";
            $("apiSaveBtn").classList.remove("api-wait-btn");
            $("apiCancelBtn").style.display = "none";
            $("dropdownArrow").style.display = "none";
            $("apiSaveBtn").disabled = true;

            if (keyType === "personal") {
                $("apiSaveBtnText").innerText = "개인 키 설치완료";
                badge.innerText = "🔒 개인 키 사용 중";
                Object.assign(badge.style, { color: "#16a34a", background: "#dcfce7", borderColor: "#86efac" });
            } else {
                $("apiSaveBtnText").innerText = "공용 키 설치완료";
                badge.innerText = "🟢 공용 키 사용 중";
                Object.assign(badge.style, { color: "#d97706", background: "#fef3c7", borderColor: "#fde68a" });
            }
        } else {
            $("apiKeyInput").value = "";
            $("apiDelBtn").style.display = "none";
            $("apiSaveBtn").disabled = false;
            $("apiSaveBtn").classList.remove("api-wait-btn");
            badge.innerText = "⚠️ 키 미설정 상태";
            Object.assign(badge.style, { color: "#dc2626", background: "#fee2e2", borderColor: "#fca5a5" });

            if (isPersonalWaitState) {
                $("apiSaveBtnText").innerText = "개인 키 설치대기";
                $("dropdownArrow").style.display = "none";
                $("apiSaveBtn").classList.add("api-wait-btn");
                $("apiCancelBtn").style.display = "inline-block";
            } else {
                checkKeyInputState();
            }
        }
    }

    function checkKeyInputState() {
        if (localStorage.getItem("GEMINI_USER_API_KEY") || isPersonalWaitState) return;
        const hasInput = $("apiKeyInput").value.trim().length > 0;
        $("apiSaveBtnText").innerText = hasInput ? "개인 키 설치하기" : "키 설치하기";
        $("dropdownArrow").style.display = hasInput ? "none" : "inline";
        $("apiCancelBtn").style.display = hasInput ? "inline-block" : "none";
    }

    function handleSaveButtonClick() {
        if (localStorage.getItem("GEMINI_USER_API_KEY")) return;
        const keyVal = $("apiKeyInput").value.trim();
        if (isPersonalWaitState || keyVal.length > 0) {
            if (keyVal.length === 0) {
                alert("API Key를 입력한 뒤 눌러주세요.");
                return $("apiKeyInput").focus();
            }
            localStorage.setItem("GEMINI_USER_API_KEY", keyVal);
            localStorage.setItem("GEMINI_KEY_TYPE", "personal");
            isPersonalWaitState = false;
            checkApiKeyStatus();
        } else {
            $("apiDropdownMenu").classList.toggle("show");
        }
    }

    function selectKeyChoice(type) {
        $("apiDropdownMenu").classList.remove('show');
        if (type === 'shared') {
            if (PUBLIC_SHARED_KEY && !PUBLIC_SHARED_KEY.startsWith("__")) {
                localStorage.setItem("GEMINI_USER_API_KEY", PUBLIC_SHARED_KEY);
                localStorage.setItem("GEMINI_KEY_TYPE", "shared");
                isPersonalWaitState = false;
                checkApiKeyStatus();
            } else {
                alert("공용 키가 설정되어 있지 않습니다.");
            }
        } else if (type === 'personal') {
            const keyVal = $("apiKeyInput").value.trim();
            if (keyVal.length > 0) {
                localStorage.setItem("GEMINI_USER_API_KEY", keyVal);
                localStorage.setItem("GEMINI_KEY_TYPE", "personal");
                isPersonalWaitState = false;
                checkApiKeyStatus();
            } else {
                isPersonalWaitState = true;
                checkApiKeyStatus();
                $("apiKeyInput").focus();
            }
        }
    }

    function cancelKeyInput() {
        isPersonalWaitState = false;
        $("apiKeyInput").value = "";
        checkApiKeyStatus();
    }

    function deleteApiKey() {
        if (confirm("저장된 API Key를 삭제하시겠습니까?")) {
            localStorage.removeItem("GEMINI_USER_API_KEY");
            localStorage.removeItem("GEMINI_KEY_TYPE");
            isPersonalWaitState = false;
            checkApiKeyStatus();
            $("apiKeyInput").focus();
        }
    }

    /* ==========================================================================
       복원(Undo) 스택 및 편집 제어
       ========================================================================== */
    function initFieldStates() {
        for (let key in fieldMap) {
            const el = $(fieldMap[key]);
            const val = el ? el.value : '';
            fieldState[key] = {
                currentSaved: val,
                history: [val]
            };
        }
    }

    function handleFieldInput(key) {
        markDirty();
        const el = $(fieldMap[key]);
        if (!el) return;
        
        const val = el.value;
        const stack = fieldState[key].history;
        if (stack[stack.length - 1] !== val) {
            stack.push(val);
            if (stack.length > 50) stack.shift();
        }
        updateStat(key, val);
    }

    function undoField(key) {
        const el = $(fieldMap[key]);
        if (!el || !fieldState[key]) return;
        const stack = fieldState[key].history;
        if (stack.length > 1) {
            stack.pop();
            el.value = stack[stack.length - 1];
            updateStat(key, el.value);
            markDirty();
        } else {
            alert('되돌릴 이전 입력 내용이 없습니다.');
        }
    }

    function restoreSaved(key) {
        const el = $(fieldMap[key]);
        if (!el || !fieldState[key]) return;
        const targetVal = fieldState[key].currentSaved;
        if (el.value === targetVal) {
            return alert('이미 최근 저장된 상태와 동일합니다.');
        }
        fieldState[key].history.push(targetVal);
        el.value = targetVal;
        updateStat(key, targetVal);
        markDirty();
    }

    function handleBulletEnter(e, textarea) {
        if (e.key === 'Enter') {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const value = textarea.value;
            const lineStart = value.lastIndexOf('\n', start - 1) + 1;
            const currentLine = value.substring(lineStart, start);

            if (currentLine.trim().startsWith('●')) {
                e.preventDefault();
                if (currentLine.trim() === '●') {
                    const before = value.substring(0, lineStart);
                    const after = value.substring(end);
                    textarea.value = before + after;
                    textarea.selectionStart = textarea.selectionEnd = lineStart;
                    return;
                }
                const bullet = '\n● ';
                textarea.value = value.substring(0, start) + bullet + value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + bullet.length;
                textarea.dispatchEvent(new Event('input'));
            }
        }
    }

    function updateStat(key, text) {
        const len = text.length;
        const readingTime = Math.ceil(len / 400);

        if (key === 'completed' || key === 'newDraft' || key === 'aiRefined') {
            const statEl = $(`stat_${key}`);
            if (statEl) {
                statEl.innerText = `${len.toLocaleString()}자 (약 ${readingTime}분)`;
            }
        } else if (key === 'intent' || key === 'snippets') {
            const statEl = $(`stat_${key}`);
            if (statEl) {
                statEl.innerText = `${len.toLocaleString()}자`;
            }
        }
    }

    function updateAllStats() {
        for (let key in fieldMap) {
            const el = $(fieldMap[key]);
            if (el) updateStat(key, el.value);
        }
    }

    function appendDraftToCompleted() {
        const aiText = $('aiRefinedText').value.trim();
        const fallbackText = $('newDraftText').value.trim();
        const textToAppend = aiText || fallbackText;

        if (!textToAppend) {
            return alert('이어 붙일 내용이 없습니다.');
        }

        const completedEl = $('completedText');
        const currentCompleted = completedEl.value.trim();

        completedEl.value = currentCompleted ? currentCompleted + "\n\n" + textToAppend : textToAppend;
        handleFieldInput('completed');

        $('newDraftText').value = '';
        $('draftIntent').value = '';$('aiRefinedText').value = '';
        handleFieldInput('newDraft');
        handleFieldInput('intent');
        handleFieldInput('aiRefined');
    }

    function saveWork(mode) {
        const payload = {
            title: $('essayTitle').value,
            outline: $('essayOutline').value,
            completed: $('completedText').value,
            newDraft: $('newDraftText').value,
            intent: $('draftIntent').value,
            aiRefined: $('aiRefinedText').value,
            snippets: $('savedSnippets').value,
            updatedAt: new Date().toISOString()
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));

        for (let key in fieldMap) {
            const el = $(fieldMap[key]);
            if (el && fieldState[key]) {
                fieldState[key].currentSaved = el.value;
            }
        }
        isDirty = false;

        if (mode === 'stay') {
            alert('저장되었습니다.');
        } else if (mode === 'exit') {
            if (confirm('저장되었습니다. 창을 닫으시겠습니까?')) {
                window.close();
            }
        }
    }

    function loadSavedData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        try {
            const data = JSON.parse(raw);
            if (data.title) $('essayTitle').value = data.title;
            if (data.outline) $('essayOutline').value = data.outline;
            if (data.completed) $('completedText').value = data.completed;
            if (data.newDraft) $('newDraftText').value = data.newDraft;
            if (data.intent) $('draftIntent').value = data.intent;
            if (data.aiRefined) $('aiRefinedText').value = data.aiRefined;
            if (data.snippets) $('savedSnippets').value = data.snippets;
            initFieldStates();
        } catch(e) {
            console.error("데이터 로드 실패", e);
        }
    }

    function cancelWork() {
        if (isDirty) {
            if (confirm('작성 중인 내용이 저장되지 않았습니다. 취소하고 마지막 저장 상태로 되돌리시겠습니까?')) {
                loadSavedData();
                isDirty = false;
            }
        } else {
            alert('변경된 내용이 없습니다.');
        }
    }

    function cancelAndClose() {
        if (isDirty) {
            if (confirm('저장되지 않은 변경사항이 있습니다. 그래도 닫으시겠습니까?')) {
                window.close();
            }
        } else {
            window.close();
        }
    }

    /* ==========================================================================
       Gemini API AI 수정 파이프라인
       ========================================================================== */
    async function requestAiRefine() {
        const apiKey = localStorage.getItem("GEMINI_USER_API_KEY");
        if (!apiKey) {
            return alert('Gemini API Key를 먼저 설치해주세요.');
        }

        const completed = $('completedText').value.trim();
        const newDraft = $('newDraftText').value.trim();
        const intent = $('draftIntent').value.trim();

        if (!newDraft) {
            return alert('신규 글을 먼저 작성해주세요.');
        }

        const prompt = `당신은 유려한 감성과 논리적인 구조를 겸비한 브런치 전문 에세이 편집자이자 라이팅 코치입니다.
다음 세 가지 정보를 분석하여 신규 글을 검토하고 퇴고안을 작성해주세요.

[이제까지 작성 완료된 글]:
${completed || "(첫 단락입니다)"}

[신규 작성한 글]:
${newDraft}

[글의 의도]:
${intent || "(별도 의도 없음)"}

[수정 가이드]:
1. 신규 글의 의도를 고려하여, 이제까지 작성 완료된 글의 흐름에 이 글이 자연스러운지 채택 여부를 먼저 판단하세요.
2. 사용하기로 했다면, 글의 흐름에 맞춰 브런치 에세이 특유의 유려하고 정돈된 문체로 수정 완성 단락을 작성해 주세요.
3. 출력 형식:
- 채택 판단 코멘트(1줄)
- [수정 완성 단락]`;

        const aiRefinedEl = $('aiRefinedText');
        aiRefinedEl.value = "AI 검토 및 퇴고 중입니다...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                aiRefinedEl.value = data.candidates[0].content.parts[0].text;
                handleFieldInput('aiRefined');
            } else {
                aiRefinedEl.value = "수정안 생성에 실패했습니다.";
                console.error(data);
            }
        } catch (err) {
            console.error(err);
            aiRefinedEl.value = "통신 중 오류가 발생했습니다.";
        }
    }
</script>
