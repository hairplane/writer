<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>글쓰기 스튜디오 (Writer Studio)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-root" class="app-layout">
    <!-- 상단 글로벌 네비게이션 헤더 -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="service-title">글쓰기 스튜디오</h1>
        <span id="sync-status" class="status-indicator">동기화 대기</span>
      </div>
      <div class="header-actions">
        <button id="btn-api-key" class="btn btn-secondary" title="Gemini API 설정">⚙️ 설정</button>
        <button id="btn-save" class="btn btn-primary">저장</button>
        <button id="btn-close-app" class="btn btn-icon" title="닫기">✕</button>
      </div>
    </header>

    <!-- 메인 워크스페이스 -->
    <main class="main-workspace">
      <!-- 좌측: 글 목록 및 필터 바 -->
      <aside class="sidebar-panel">
        <div class="filter-controls">
          <select id="category-filter" class="form-select">
            <option value="ALL">전체 분류</option>
          </select>
          <button id="btn-new-article" class="btn btn-outline-primary">+ 새 글</button>
        </div>
        <div id="article-list-container" class="article-list-scroll"></div>
      </aside>

      <!-- 우측: 7대 집필 창 동적 마운트 컨테이너 -->
      <section class="editor-panel">
        <div class="article-meta-bar">
          <input type="text" id="article-category-input" class="form-input category-input" placeholder="분류(62px)" maxlength="10">
          <input type="text" id="article-title-input" class="form-input title-input" placeholder="글 제목을 입력하세요">
          <button id="btn-status-toggle" class="btn status-badge-btn" data-status="작성">작성</button>
        </div>
        <div id="dynamic-sections-container" class="dynamic-sections-flow"></div>
      </section>
    </main>

    <!-- 커스텀 저장 확인 모달 -->
    <div id="unsaved-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">⚠️ 저장 확인</h3>
        </div>
        <div class="modal-body">
          <p>저장되지 않은 변경사항이 있습니다.<br>어떻게 처리할까요?</p>
        </div>
        <div class="modal-footer">
          <button id="modal-btn-cancel" class="btn btn-secondary">계속 편집</button>
          <button id="modal-btn-discard" class="btn btn-danger">저장 안 함</button>
          <button id="modal-btn-save" class="btn btn-primary">저장하고 종료</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
