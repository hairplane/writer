<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>글쓰기 스튜디오</title>
  <!-- 1. 불변 시스템 레이아웃 엔진 라이브러리 -->
  <link rel="stylesheet" href="core.css">
  <!-- 2. 커스텀 테마, 색상, 디자인 스타일시트 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Mac 스타일 2단 헤더 -->
    <header class="mac-window-header">
      <div class="header-top-row">
        <div class="header-title-wrap">
          <h1>✍️ 글쓰기 스튜디오</h1>
          <span class="version-tag">v3.1</span>
        </div>
        <button type="button" class="btn-close-app" id="btn-header-close" title="닫기">✕</button>
      </div>
      <div class="header-toggle-row">
        <span class="toggle-guide-label">열고 닫기:</span>
        <div class="traffic-group">
          <button type="button" id="dot_postList" class="traffic-btn tb-postList" title="작성 글 목록 토글"></button>
          <button type="button" id="dot_meta" class="traffic-btn tb-meta" title="작성 글 정보 표 토글"></button>
          <button type="button" id="dot_outline" class="traffic-btn tb-outline" title="글의 구성 토글"></button>
          <button type="button" id="dot_completed" class="traffic-btn tb-completed" title="완성 글 토글"></button>
          <button type="button" id="dot_newDraft" class="traffic-btn tb-newDraft" title="신규 글 토글"></button>
          <button type="button" id="dot_intent" class="traffic-btn tb-intent" title="글의 의도 토글"></button>
          <button type="button" id="dot_api" class="traffic-btn tb-api" title="API 설정 토글"></button>
          <button type="button" id="dot_promptReq" class="traffic-btn tb-promptReq" title="요청 내용 to AI 토글"></button>
          <button type="button" id="dot_aiRefined" class="traffic-btn tb-aiRefined" title="AI 수정 글 토글"></button>
          <button type="button" id="dot_snippets" class="traffic-btn tb-snippets" title="보관 글 토글"></button>
        </div>
      </div>
    </header>

    <!-- 상단 액션 툴바 -->
    <div class="action-toolbar-clean" id="mainActionToolbar">
      <button type="button" id="btn-save-stay" class="btn btn-default">저장/계속</button>
      <button type="button" id="btn-save-exit" class="btn btn-primary">저장/종료</button>
      <button type="button" id="btn-cancel-work" class="btn btn-danger">취소</button>
    </div>

    <!-- 1. 작성 글 목록 섹션 -->
    <section class="post-list-box" id="sec_postList">
      <div class="post-list-header" id="hdr_postList">
        <div class="post-list-title-wrap">
          <button type="button" id="arrow_postList" class="btn-section-toggle" title="열림/숨김">−</button>
          <span class="section-title" id="title_postList" title="클릭 시 단독 집중 모드">작성 글 목록</span>
          <span id="badge_postList" class="badge-collapsed">숨김</span>
        </div>
        <div class="filter-group">
          <label class="filter-label">분류:
            <select id="categoryFilter" class="select-filter">
              <option value="전체">전체</option>
            </select>
          </label>
          <label class="filter-label">상황:
            <select id="statusFilter" class="select-filter">
              <option value="전체">전체</option>
              <option value="작성">작성</option>
              <option value="완료">완료</option>
              <option value="예정">예정</option>
            </select>
          </label>
        </div>
      </div>
      <div class="post-list-rows" id="body_postList"></div>
    </section>

    <!-- 2. 작성 글 정보(메타) 섹션 -->
    <section class="meta-table-box" id="sec_meta">
      <div class="meta-table-header" id="hdr_meta">
        <div class="section-header-left">
          <button type="button" id="arrow_meta" class="btn-section-toggle" title="열림/숨김">−</button>
          <span class="section-title" id="title_meta" title="클릭 시 단독 집중 모드">작성 글 정보</span>
          <span id="badge_meta" class="badge-collapsed">숨김</span>
        </div>
      </div>
      <div class="meta-content-wrap" id="body_meta">
        <table class="meta-grid-table">
          <tbody>
            <tr>
              <th>제목[ID]</th>
              <td colspan="3"><input type="text" id="essayTitleInput" placeholder="글 제목을 입력하세요"></td>
            </tr>
            <tr>
              <th>시작일</th>
              <td><input type="text" id="postStartDate" placeholder="YYYYMMDD"></td>
              <th>완료일</th>
              <td><input type="text" id="postEndDate" placeholder="YYYYMMDD"></td>
            </tr>
            <tr>
              <th>요약</th>
              <td colspan="3"><textarea id="postSummary" rows="2" placeholder="글의 핵심 요약을 기록하세요"></textarea></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 3. API 설정 섹션 -->
    <div class="api-box editor-section" id="sec_api">
      <div class="api-box-header section-header-line" id="hdr_api">
        <div class="api-header-left">
          <button type="button" id="arrow_api" class="btn-section-toggle" title="열림/숨김">−</button>
          <span class="section-title" id="title_api" title="클릭 시 단독 집중 모드">API 설정</span>
          <span id="badge_api" class="badge-collapsed">숨김</span>
          <span class="api-status-badge" id="apiStatusBadge">⚠️ 키 미설정 상태</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="btn-key-compact" title="Gemini 키 발급받기">🔑</a>
        </div>
      </div>
      <div class="api-content-wrap" id="body_api">
        <div class="api-row">
          <input type="password" id="apiKeyInput" placeholder="Google Gemini API Key 입력">
          <div class="api-btn-group">
            <div class="dropdown">
              <button type="button" id="apiSaveBtn" class="api-save-btn">
                <span id="apiSaveBtnText">키 설치하기</span>
                <span id="dropdownArrow">▼</span>
              </button>
              <div id="apiDropdownMenu" class="dropdown-content">
                <button type="button" id="btn-api-shared">공용 키 사용</button>
                <button type="button" id="btn-api-personal">개인 키 등록</button>
              </div>
            </div>
            <button type="button" id="apiCancelBtn" class="api-cancel-btn">취소</button>
            <button type="button" id="apiDelBtn" class="api-del-btn">삭제</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. 나머지 7개 집필 창 동적 생성 컨테이너 -->
    <main id="editor-container"></main>
  </div>

  <!-- 커스텀 저장 확인 모달 -->
  <div id="unsaved-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">⚠️ 저장 확인</h3>
      <p class="modal-desc">저장되지 않은 변경사항이 있습니다. 어떻게 처리할까요?</p>
      <div class="modal-actions">
        <button type="button" id="modal-btn-cancel" class="btn btn-default">계속 편집</button>
        <button type="button" id="modal-btn-discard" class="btn btn-danger">저장 안 함</button>
        <button type="button" id="modal-btn-save" class="btn btn-primary">저장하고 진행</button>
      </div>
    </div>
  </div>

  <!-- 스크립트 로드 순서: 엔진 -> 시트 모듈 -> API 모듈 -> 메인 앱 -->
  <script src="core.js"></script>
  <script src="sheet.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
